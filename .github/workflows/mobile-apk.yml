name: mobile-apk

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create clean Android scaffold
        run: |
          rm -rf /tmp/voltra_mobile
          flutter create /tmp/voltra_mobile \
            --platforms=android \
            --org com.ayman.voltra \
            --project-name voltra_mobile

      - name: Overlay Voltra source
        run: |
          rm -rf /tmp/voltra_mobile/lib /tmp/voltra_mobile/test /tmp/voltra_mobile/assets
          cp -R mobile/lib /tmp/voltra_mobile/lib
          cp -R mobile/test /tmp/voltra_mobile/test
          cp -R mobile/assets /tmp/voltra_mobile/assets
          cp mobile/pubspec.yaml /tmp/voltra_mobile/pubspec.yaml
          cp mobile/android/AndroidManifest.xml /tmp/voltra_mobile/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/voltra_mobile/android/app/src/main/kotlin/com/ayman/voltra/voltra_mobile
          cp mobile/android/MainActivity.kt /tmp/voltra_mobile/android/app/src/main/kotlin/com/ayman/voltra/voltra_mobile/MainActivity.kt

      - name: Install dependencies
        working-directory: /tmp/voltra_mobile
        run: flutter pub get

      - name: Check incompatible preferences plugin is excluded
        working-directory: /tmp/voltra_mobile
        run: |
          if grep -Eq '^[[:space:]]+shared_preferences(_android)?:' pubspec.lock; then
            echo "::error::Legacy shared_preferences plugin cannot be bundled with Voltra."
            exit 1
          fi

      - name: Generate launcher icon and splash
        working-directory: /tmp/voltra_mobile
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Make Android launch theme biometric-compatible
        working-directory: /tmp/voltra_mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("android/app/src/main/res").rglob("styles.xml"):
              text = path.read_text()
              text = text.replace(
                  'parent="@android:style/Theme.Light.NoTitleBar"',
                  'parent="Theme.AppCompat.DayNight.NoActionBar"',
              )
              text = text.replace(
                  'parent="@android:style/Theme.Black.NoTitleBar"',
                  'parent="Theme.AppCompat.DayNight.NoActionBar"',
              )
              path.write_text(text)
          PY

      - name: Configure optional production signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.VOLTRA_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VOLTRA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOLTRA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOLTRA_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            test -n "$KEYSTORE_PASSWORD"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/voltra_mobile/voltra-release.jks
            echo "VOLTRA_SIGNING=production" >> "$GITHUB_ENV"
          else
            echo "VOLTRA_SIGNING=test" >> "$GITHUB_ENV"
          fi

      - name: Use test signing for pull requests
        if: github.event_name == 'pull_request'
        run: echo "VOLTRA_SIGNING=test" >> "$GITHUB_ENV"

      - name: Verify permanent application ID
        run: |
          grep -q 'applicationId = "com.ayman.voltra.voltra_mobile"' /tmp/voltra_mobile/android/app/build.gradle.kts

      - name: Analyze
        working-directory: /tmp/voltra_mobile
        run: flutter analyze

      - name: Test
        working-directory: /tmp/voltra_mobile
        run: flutter test

      - name: Build release APK
        working-directory: /tmp/voltra_mobile
        run: flutter build apk --release

      - name: Allow Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Boot release APK and catch Android startup failures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.ayman.voltra.voltra_mobile/.MainActivity
            sleep 12
            adb shell pidof com.ayman.voltra.voltra_mobile
            adb logcat -d -v brief > /tmp/voltra-startup-log.txt
            ! grep -E 'SharedPreferencesApiRegistrar|NoSuchMethodError|FATAL EXCEPTION' /tmp/voltra-startup-log.txt

      - name: Apply and verify production APK signature
        if: env.VOLTRA_SIGNING == 'production'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VOLTRA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOLTRA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOLTRA_ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/voltra_mobile/voltra-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out /tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release-production.apk \
            /tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs \
            /tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release-production.apk

      - name: Prepare artifact
        run: |
          mkdir -p mobile-artifact
          if [ "$VOLTRA_SIGNING" = "production" ]; then
            SRC=/tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release-production.apk
          else
            SRC=/tmp/voltra_mobile/build/app/outputs/flutter-apk/app-release.apk
          fi
          cp "$SRC" "mobile-artifact/Voltra-Mobile-v1.5.0-${VOLTRA_SIGNING}-signed.apk"
          sha256sum mobile-artifact/*.apk > mobile-artifact/SHA256SUMS.txt
          printf 'package_id=com.ayman.voltra.voltra_mobile\nversion=1.5.0+9\nsigning=%s\n' "$VOLTRA_SIGNING" > mobile-artifact/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Voltra-Mobile-v1.5.0
          path: mobile-artifact/
          retention-days: 90
          if-no-files-found: error
