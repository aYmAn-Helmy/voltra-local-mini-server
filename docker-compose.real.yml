services:
  voltra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltra
    restart: unless-stopped
    environment:
      VOLTRA_DEMO: "0"
      VOLTRA_TCP_BIND: "0.0.0.0"
      VOLTRA_HTTP_BIND: "0.0.0.0"
      VOLTRA_HTTP_PORT: "8086"
      VOLTRA_TCP_PORT: "10086"
      VOLTRA_CORS_ORIGIN: "${VOLTRA_CORS_ORIGIN:-*}"
      VOLTRA_POLL_INTERVAL: "${VOLTRA_POLL_INTERVAL:-10}"
      VOLTRA_DIAGNOSTICS_INTERVAL: "${VOLTRA_DIAGNOSTICS_INTERVAL:-30}"
      VOLTRA_TELEMETRY_INTERVAL: "${VOLTRA_TELEMETRY_INTERVAL:-60}"
      VOLTRA_COMMAND_ATTEMPTS: "${VOLTRA_COMMAND_ATTEMPTS:-2}"
      VOLTRA_COMMAND_CONFIRM_DELAY: "${VOLTRA_COMMAND_CONFIRM_DELAY:-0.15}"
      VOLTRA_RATE_LIMIT_PER_MINUTE: "${VOLTRA_RATE_LIMIT_PER_MINUTE:-120}"
      VOLTRA_DATA_DIR: "/app/data"
    ports:
      - "${VOLTRA_HTTP_PORT_HOST:-8086}:8086/tcp"
      - "${VOLTRA_TCP_PORT_HOST:-10086}:10086/tcp"
    volumes:
      - voltra_data:/app/data

volumes:
  voltra_data:
