name: voltra

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: voltra-mosquitto
    restart: unless-stopped
    ports:
      - "${VOLTRA_MQTT_HOST_BIND:-127.0.0.1}:1883:1883/tcp"
    volumes:
      - /DATA/AppData/Voltra/mosquitto/config:/mosquitto/config:ro
      - /DATA/AppData/Voltra/mosquitto/data:/mosquitto/data

  voltra:
    depends_on:
      - mosquitto
    build:
      context: .
      dockerfile: Dockerfile
    image: voltra-local-mini-server:casaos
    container_name: voltra
    restart: unless-stopped
    environment:
      VOLTRA_DEMO: "0"
      TZ: "${VOLTRA_TIMEZONE:-Africa/Cairo}"
      VOLTRA_TCP_BIND: "0.0.0.0"
      VOLTRA_HTTP_BIND: "0.0.0.0"
      VOLTRA_HTTP_PORT: "8086"
      VOLTRA_TCP_PORT: "10086"
      VOLTRA_DISCOVERY_PORT: "10087"
      VOLTRA_CORS_ORIGIN: "${VOLTRA_CORS_ORIGIN:-*}"
      VOLTRA_API_TOKEN: "${VOLTRA_API_TOKEN:-}"
      VOLTRA_TRUSTED_PROXY: "${VOLTRA_TRUSTED_PROXY:-}"
      VOLTRA_PUBLIC_ORIGIN: "${VOLTRA_PUBLIC_ORIGIN:-}"
      VOLTRA_POLL_INTERVAL: "${VOLTRA_POLL_INTERVAL:-10}"
      VOLTRA_DIAGNOSTICS_INTERVAL: "${VOLTRA_DIAGNOSTICS_INTERVAL:-30}"
      VOLTRA_TELEMETRY_INTERVAL: "${VOLTRA_TELEMETRY_INTERVAL:-60}"
      VOLTRA_DATA_DIR: "/app/data"
      VOLTRA_MQTT_ENABLED: "${VOLTRA_MQTT_ENABLED:-0}"
      VOLTRA_MQTT_HOST: "mosquitto"
      VOLTRA_MQTT_PORT: "1883"
      VOLTRA_MQTT_USERNAME: "${VOLTRA_MQTT_USERNAME:-voltra}"
      VOLTRA_MQTT_PASSWORD: "${VOLTRA_MQTT_PASSWORD:-}"
      VOLTRA_MQTT_TOPIC_PREFIX: "${VOLTRA_MQTT_TOPIC_PREFIX:-voltra}"
    ports:
      - "8086:8086/tcp"
      - "10086:10086/tcp"
      - "10087:10087/udp"
    volumes:
      - /DATA/AppData/Voltra/data:/app/data
