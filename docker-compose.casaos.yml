name: voltra

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: voltra-mosquitto
    restart: unless-stopped
    ports:
      - "${VOLTRA_MQTT_HOST_BIND:-127.0.0.1}:1883:1883/tcp"
    volumes:
      - /DATA/AppData/Voltra/mosquitto/config:/mosquitto/config:ro
      - /DATA/AppData/Voltra/mosquitto/data:/mosquitto/data

  voltra:
    depends_on:
      - mosquitto
    image: ghcr.io/ayman-helmy/voltra-local-mini-server:latest
    container_name: voltra
    restart: unless-stopped
    environment:
      VOLTRA_DEMO: "0"
      TZ: "${VOLTRA_TIMEZONE:-Africa/Cairo}"
      VOLTRA_TCP_BIND: "0.0.0.0"
      VOLTRA_HTTP_BIND: "0.0.0.0"
      VOLTRA_HTTP_PORT: "8086"
      VOLTRA_TCP_PORT: "10086"
      VOLTRA_DISCOVERY_PORT: "10087"
      VOLTRA_CORS_ORIGIN: "${VOLTRA_CORS_ORIGIN:-*}"
      VOLTRA_API_TOKEN: "${VOLTRA_API_TOKEN:-}"
      VOLTRA_TRUSTED_PROXY: "${VOLTRA_TRUSTED_PROXY:-}"
      VOLTRA_PUBLIC_ORIGIN: "${VOLTRA_PUBLIC_ORIGIN:-}"
      VOLTRA_POLL_INTERVAL: "${VOLTRA_POLL_INTERVAL:-10}"
      VOLTRA_DIAGNOSTICS_INTERVAL: "${VOLTRA_DIAGNOSTICS_INTERVAL:-30}"
      VOLTRA_TELEMETRY_INTERVAL: "${VOLTRA_TELEMETRY_INTERVAL:-60}"
      VOLTRA_COMMAND_ATTEMPTS: "${VOLTRA_COMMAND_ATTEMPTS:-2}"
      VOLTRA_COMMAND_CONFIRM_DELAY: "${VOLTRA_COMMAND_CONFIRM_DELAY:-0.15}"
      VOLTRA_RATE_LIMIT_PER_MINUTE: "${VOLTRA_RATE_LIMIT_PER_MINUTE:-120}"
      VOLTRA_DATA_DIR: "/app/data"
      VOLTRA_MQTT_ENABLED: "${VOLTRA_MQTT_ENABLED:-0}"
      VOLTRA_MQTT_HOST: "mosquitto"
      VOLTRA_MQTT_PORT: "1883"
      VOLTRA_MQTT_USERNAME: "${VOLTRA_MQTT_USERNAME:-voltra}"
      VOLTRA_MQTT_PASSWORD: "${VOLTRA_MQTT_PASSWORD:-}"
      VOLTRA_MQTT_TOPIC_PREFIX: "${VOLTRA_MQTT_TOPIC_PREFIX:-voltra}"
    ports:
      - target: 8086
        published: "8086"
        protocol: tcp
      - target: 10086
        published: "10086"
        protocol: tcp
      - target: 10087
        published: "10087"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/Voltra/data
        target: /app/data
    x-casaos:
      volumes:
        - container: /app/data
          description:
            en_us: Persistent Voltra data
      ports:
        - container: "8086"
          description:
            en_us: Voltra Dashboard / API
        - container: "10086"
          description:
            en_us: MTTL-W01 device TCP connection
        - container: "10087"
          description:
            en_us: Voltra-X LAN discovery (UDP)

x-casaos:
  id: com.voltra.local
  main: voltra
  index: /voltra
  port_map: "8086"
  scheme: http
  title:
    en_us: Voltra Local
  tagline:
    en_us: Local control server for MTTL-W01 power strips
  description:
    en_us: Local-first dashboard, automation and telemetry server for LG U+ / TONLY MTTL-W01 smart power strips.
  category: "Home Automation"
  author: aYmAn-Helmy
  developer: aYmAn-Helmy
  architectures:
    - amd64
    - arm64
  icon: https://raw.githubusercontent.com/aYmAn-Helmy/voltra-local-mini-server/main/casaos/icon.svg
  store_app_id: voltra-local
