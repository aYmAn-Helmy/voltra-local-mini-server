services:
  voltra-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltra-demo
    restart: unless-stopped
    environment:
      VOLTRA_DEMO: "1"
      VOLTRA_TCP_BIND: "0.0.0.0"
      VOLTRA_HTTP_BIND: "0.0.0.0"
      VOLTRA_HTTP_PORT: "8086"
      VOLTRA_TCP_PORT: "10086"
      VOLTRA_DISCOVERY_PORT: "10087"
      VOLTRA_ALLOW_INSECURE_REMOTE: "1"
      VOLTRA_POLL_INTERVAL: "3"
      VOLTRA_DIAGNOSTICS_INTERVAL: "10"
      VOLTRA_TELEMETRY_INTERVAL: "10"
      VOLTRA_COMMAND_ATTEMPTS: "2"
      VOLTRA_COMMAND_CONFIRM_DELAY: "0.15"
      VOLTRA_DATA_DIR: "/app/data"
    ports:
      - "127.0.0.1:8086:8086"
      - "10087:10087/udp"
    volumes:
      - voltra_demo_data:/app/data

volumes:
  voltra_demo_data:
